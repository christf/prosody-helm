apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prosody-helm.fullname" . }}
  labels:
    {{- include "prosody-helm.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "prosody-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "prosody-helm.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "prosody-helm.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: __FLUSH_LOG
              value: "1"
            {{ .Values.prosody.env }}
          -- todo: add secrets for slidge
          ports:
            - containerPort: 5280
              protocol: TCP
              name: http
            - containerPort: 5281
              protocol: TCP
              name: https
            - containerPort: 5222
              protocol: TCP
              name: c2s
            - containerPort: 5269
              protocol: TCP
              name: s2s
          livenessProbe:
            timeoutSeconds: 5
            exec:
              command:
                - prosodyctl
                - --config
                - /etc/prosody/prosody.cfg.lua
                - status
          readinessProbe:
            timeoutSeconds: 5
            exec:
              command:
                - prosodyctl
                - --config
                - /etc/prosody/prosody.cfg.lua
                - status
          startupProbe:
            exec:
              command:
                - prosodyctl
                - --config
                - /etc/prosody/prosody.cfg.lua
                - status
          volumeMounts:
            - mountPath: /etc/prosody
              name: prosody-config
            - mountPath: /var/lib/prosody
              name: prosody-data
            - mountPath: /var/lib/prosody/custom_plugins
              name: prosody-modules
            - mountPath: /etc/prosody/certs
              name: prosody-cert
          resources:
              {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.slidge }}
      {{- if .Values.slidge.matrix }}
      {{- if .Values.slidge.matrix.enabled }}
      {{- if eq(.Values.slidge.matrix.enabled) "true" -}}
      {{- with .Values.slidge.matrix }}
      - name: slidge-matrix
        image: {{ .repository }}:{{ .tag }}
        imagePullPolicy: IfNotPresent
        args: ["-d",
        "--jid", {{ .component }}
        "--secret", "$(SECRET)",
        "--user-jid-validator", {{ .jidValidator }}
        "--home-dir", "/var/lib/slidge/slidge-matrix"
        "--max-history-fetch", {{ .maxHistoryFetch }} ]
        env:
          - name: SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .secretName }}
                key: SECRET
        volumeMounts:
          - mountPath: /var/lib/slidge/slidge-matrix"
            name: slidge-matrix-data
        {{- end -}}
        {{- end -}}
        {{- end -}}
        {{- end -}}
      {{- end -}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: prosody-config
          configMap:
            name: {{ include "prosody-helm.fullname" . }}-config
        {{- if .Values.ingress }}
        {{- if .Values.ingress.enabled }}
        {{- if eq(.Values.ingress.enabled) "true" }}
        {{- if .Values.ingress.tls }}
        {{- if .Values.ingress.tls.secretName }}
        - name: {{ .Values.ingress.tls.secretName }}
          secret:
            secretName: prosody-cert
        {{- end -}}
        {{- end -}}
        {{- end -}}
        {{- end -}}
        {{- end -}}
        {{- if .Values.slidge }}
        {{- if .Values.slidge.matrix }}
        {{- if .Values.slidge.matrix.enabled }}
        {{- if eq(.Values.slidge.matrix.enabled) "true" }}
        - name: slidge-matrix-data
          persistentVolumeClaim:
            claimName: {{ include "prosody-helm.fullname" . }}-matrix-data
        {{- end -}}
        {{- end -}}
        {{- end -}}
        {{- if .Values.slidge.whatsapp }}
        {{- if .Values.slidge.whatsapp.enabled }}
        {{- if eq(.Values.slidge.whatsapp.enabled) "true" }}
        - name: slidge-whatsapp-data
          persistentVolumeClaim:
            claimName: {{ include "prosody-helm.fullname" . }}-whatsapp-data
        {{- end -}}
        {{- end -}}
        {{- end -}}
        {{- if .Values.slidge.discord }}
        {{- if .Values.slidge.discord.enabled }}
        {{- if eq(.Values.slidge.discord.enabled) "true" }}
        - name: slidge-discord-data
          persistentVolumeClaim:
            claimName: {{ include "prosody-helm.fullname" . }}-discord-data
        {{- end -}}
        {{- end -}}
        {{- end -}}
        {{- if .Values.slidge.signal }}
        {{- if .Values.slidge.signal.enabled }}
        {{- if eq(.Values.slidge.signal.enabled) "true" }}
        - name: slidge-signal-data
          persistentVolumeClaim:
            claimName: {{ include "prosody-helm.fullname" . }}-signal-data
        {{- end -}}
        {{- end -}}
        {{- end -}}
        {{- end -}}
        - name: prosody-data
          persistentVolumeClaim:
            claimName: {{ include "prosody-helm.fullname" . }}-data
        - name: prosody-modules
          persistentVolumeClaim:
            claimName: {{ include "prosody-helm.fullname" . }}-modules




















